[project]
name = "cogito"
version = "0.3.0"
description = "An experiment in autonomous AI cognition through recursive self-prompting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kenneth Kienle", email = "kenneth.kienle@uistlabs.com" },
]
keywords = [
    "llm",
    "llama-cpp",
    "gguf",
    "ai",
    "recursive-self-prompting",
    "cognition",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
cogito = "cogito:main"
cogito-viz = "visualize:main"
cogito-viz-advanced = "visualize_advanced:main"

[project.urls]
Homepage = "https://github.com/uistlabs/cogito"
Repository = "https://github.com/uistlabs/cogito"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat single-module layout: package the top-level modules explicitly (no src/).
# cogito_backends.py is added to this list in the backend-catalog task.
[tool.hatch.build.targets.wheel]
include = [
    "cogito.py",
    "visualize.py",
    "visualize_advanced.py",
]
